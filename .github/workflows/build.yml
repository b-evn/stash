name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest waiting push gets built. A running build finishes, so it can save its cache:
# cancelling one that started cold would leave the next one cold too.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned, since a new Rust release makes the whole cache stale; bump it on purpose.
  RUST_TOOLCHAIN: "1.99.1"
  TAURI_CLI: "2.12.4"
  # Tests need no debug info; leaving it out keeps the test build quick and the cache small.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: UI tests
        working-directory: ui
        run: node search.test.js && node secrets.test.js
      - name: Rust tests
        run: cargo test --lib
      # Prebuilt from npm; `cargo install tauri-cli` compiles it, for 10 minutes or more whenever the cache is cold.
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@${{ env.TAURI_CLI }}
      # Only the installer is uploaded, so the MSI isn't built.
      - name: Build
        run: tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: stash-windows
          path: |
            src-tauri/target/release/stash.exe
            src-tauri/target/release/bundle/nsis/*.exe

  macos:
    # Apple Silicon, which builds both halves of the universal app faster than the Intel runner.
    runs-on: macos-15
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        run: cargo test --lib
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@${{ env.TAURI_CLI }}
      - name: Build
        run: ../scripts/build-mac.sh --target universal-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: stash-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
