<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stash README art</title>
<!-- The README's pictures: the real popup (ui/index.html with its demo data) framed over the paintings in docs/art.
     Pick one with ?shot=hero|title|stack|panels|keys|secrets&theme=dark|light (title takes &s=1..6); scripts/readme-art.sh renders them all. -->
<style>
  @font-face { font-family: "Geist"; src: url("../ui/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../ui/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
  :root {
    --bg: #fafafa; --panel: #ffffff; --fg: #09090b; --soft: #27272a; --muted: #71717a; --line: #e4e4e7;
    --hair: rgba(9, 9, 11, .08); --ring-top: #fff; --lamp: rgba(255, 255, 255, .9);
    --scrim: 250, 250, 250; --art: url("art/olympus.jpg");
    --tile-bg: linear-gradient(180deg, #ffffff, #f4f4f5);
    --tile-shadow: inset 0 1px 0 #fff, 0 0 0 1px rgba(9, 9, 11, .08), 0 1px 2px rgba(9, 9, 11, .06), 0 6px 14px -6px rgba(9, 9, 11, .14);
    --key-fg: #3f3f46; --key-bg: linear-gradient(180deg, #ffffff, #f4f4f5);
    --key-shadow: inset 0 0 0 1px rgba(9, 9, 11, .1), inset 0 -2px 0 rgba(9, 9, 11, .05), 0 1px 0 rgba(9, 9, 11, .12), 0 4px 10px -4px rgba(9, 9, 11, .18);
    --card-shadow: 0 0 0 1px rgba(9, 9, 11, .08), 0 2px 4px rgba(9, 9, 11, .05), 0 24px 48px -16px rgba(9, 9, 11, .28);
    --desk: #ffffff; --desk-bar: #f7f7f8;
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --panel: #0e0e10; --fg: #fafafa; --soft: #e4e4e7; --muted: #a1a1aa; --line: #27272a;
    --hair: rgba(255, 255, 255, .09); --ring-top: rgba(255, 255, 255, .18); --lamp: rgba(255, 255, 255, .06);
    --scrim: 9, 9, 11; --art: url("art/phaeton.jpg");
    --tile-bg: linear-gradient(180deg, #222226, #141416);
    --tile-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), inset 0 1px 0 rgba(255, 255, 255, .08), 0 1px 2px rgba(0, 0, 0, .6), 0 8px 18px -8px rgba(0, 0, 0, .7);
    --key-fg: #e4e4e7; --key-bg: linear-gradient(180deg, #27272b, #18181b);
    --key-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09), inset 0 1px 0 rgba(255, 255, 255, .1), 0 2px 0 rgba(0, 0, 0, .8), 0 6px 12px -4px rgba(0, 0, 0, .7);
    --card-shadow: 0 0 0 1px rgba(0, 0, 0, .8), 0 2px 4px rgba(0, 0, 0, .4), 0 30px 60px -16px rgba(0, 0, 0, .8);
    --desk: #111113; --desk-bar: #161618;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font: 15px/1.45 "Geist", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i .dot { stroke-width: 2.4; }

  /* The frame every picture sits in: rounded, hairline border, nothing outside it. */
  .frame { position: relative; width: 100%; height: 100%; border-radius: 28px; overflow: hidden; isolation: isolate; background: var(--bg); }
  .frame::after { content: ""; position: absolute; inset: 0; z-index: 100; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--ring-top); }
  .art { position: absolute; inset: 0; background: var(--art) center / cover no-repeat; }
  .lamp { position: absolute; inset: 0 0 auto; height: 260px; background: radial-gradient(60% 100% at 50% 0, var(--lamp), transparent 75%); pointer-events: none; }
  .pop { position: absolute; width: 432px; border: 0; background: transparent; z-index: 5; }
  .caption { position: absolute; z-index: 6; color: var(--muted); font-size: 17px; letter-spacing: -.01em; text-align: center; }
  .caption b { color: var(--fg); font-weight: 550; }

  .kbd { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 46px; height: 46px; padding: 0 13px; border-radius: 11px; color: var(--key-fg); background: var(--key-bg); box-shadow: var(--key-shadow); font: 500 18px/1 "Geist", system-ui, sans-serif; }
  .kbd.sm { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; font-size: 12px; }
  .kbd svg.i { width: 19px; height: 19px; stroke-width: 1.9; }
  .kbd.sm svg.i { width: 12px; height: 12px; stroke-width: 2.1; }
  .tile { position: relative; display: grid; place-items: center; flex: none; color: var(--soft); background: var(--tile-bg); box-shadow: var(--tile-shadow); }
  .glass { position: relative; border-radius: 18px; overflow: hidden; background: radial-gradient(90% 160px at 50% 0, var(--lamp), transparent 72%) no-repeat, var(--panel); box-shadow: var(--card-shadow), inset 0 1px 0 var(--ring-top); }
  .rule { height: 1px; background: linear-gradient(90deg, transparent, var(--hair) 14%, var(--hair) 86%, transparent); }
  .secret { color: transparent; text-shadow: 0 0 7px var(--fg); }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; letter-spacing: -.02em; }

  /* hero */
  .scrim-l { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(var(--scrim), .97) 0%, rgba(var(--scrim), .9) 33%, rgba(var(--scrim), .38) 60%, rgba(var(--scrim), .12) 100%); }
  .scrim-v { position: absolute; inset: 0; background: radial-gradient(120% 90% at 70% 45%, transparent 40%, rgba(var(--scrim), .55)); }
  .icon { width: 76px; height: 76px; border-radius: 19px; background: linear-gradient(180deg, #1c1c1f, #0c0c0d); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 0 0 1px rgba(0, 0, 0, .6), 0 12px 28px -10px rgba(0, 0, 0, .6); display: grid; align-content: center; gap: 7px; padding-left: 18px; }
  .icon i { display: block; height: 9px; border-radius: 5px; background: #f4f4f5; }
  .word { font-size: 132px; font-weight: 600; letter-spacing: -.06em; line-height: .9; margin: 30px 0 0 -6px; }
  .tag { margin-top: 22px; font-size: 31px; font-weight: 450; letter-spacing: -.025em; color: var(--muted); line-height: 1.15; }
  .tag b { color: var(--fg); font-weight: 500; }
  .halo { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .16), transparent); z-index: 4; }
  :root:not([data-theme="dark"]) .halo { background: radial-gradient(closest-side, rgba(255, 255, 255, .95), transparent); }

  /* Divine light: the one warm colour, borrowed from the paintings' gold. */
  :root { --gold: #a87622; --gold-soft: rgba(196, 140, 40, .55); --gold-glow: rgba(214, 158, 52, .5); --ink: #1c1917; }
  :root[data-theme="dark"] { --gold: #f1cf8b; --gold-soft: rgba(241, 207, 139, .5); --gold-glow: rgba(255, 196, 92, .55); --ink: #f5f5f4; }
  .serif { font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
  .kbd.lit { transform: translateY(3px); filter: brightness(1.6); box-shadow: inset 0 0 0 1px var(--hair), 0 0 0 rgba(0, 0, 0, 0); }
  .note { position: absolute; z-index: 3; border-radius: 16px; overflow: hidden; background: var(--desk); box-shadow: 0 0 0 1px var(--line), 0 50px 100px -30px rgba(0, 0, 0, .7), inset 0 1px 0 var(--ring-top); }
  .note .desk-bar { height: 44px; }
  .note .hdr { display: flex; gap: 10px; padding: 13px 26px; border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
  .note .hdr b { color: var(--fg); font-weight: 500; }
  .note .body { padding: 20px 26px 26px; font-size: 16px; line-height: 30px; letter-spacing: -.01em; color: var(--soft); }
  .note .caret { display: inline-block; width: 2px; height: 20px; margin: 0 0 -4px 1px; background: var(--fg); border-radius: 1px; }
  .note .pasted { color: var(--fg); border-radius: 4px; padding: 1px 0; }
  .frame.bare { background: transparent; border-radius: 0; }
  .frame.bare::after { display: none; }
  .ttile { width: 72px; height: 72px; border-radius: 19px; color: var(--gold); box-shadow: var(--tile-shadow), 0 0 0 1px var(--gold-soft), 0 0 26px -6px var(--gold-glow); }
  .ttile svg.i { width: 30px; height: 30px; stroke-width: 1.6; }

  /* stack */
  .desk { position: absolute; border-radius: 14px; background: var(--desk); box-shadow: 0 0 0 1px var(--line), 0 40px 90px -30px rgba(0, 0, 0, .55); overflow: hidden; z-index: 2; }
  .desk-bar { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--desk-bar); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .desk-bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
  .desk-bar span { margin-left: 10px; }
  .field { padding: 0 26px; margin-top: 22px; }
  .field label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 500; }
  .input { height: 40px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .input.focus { border-color: var(--muted); box-shadow: 0 0 0 3px rgba(161, 161, 170, .3); color: var(--fg); }
  .input .caret { width: 1.5px; height: 19px; background: var(--fg); }
  .seq { position: absolute; z-index: 3; padding: 8px; }
  .step { display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 14px; }
  .step .n { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 12px; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 600; flex: none; }
  .step .n.next { box-shadow: 0 0 0 3px var(--panel), 0 0 0 4.5px var(--fg), 0 0 18px rgba(255, 255, 255, .25); }
  .step .arrow { color: var(--muted); }
  .step .v { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; letter-spacing: -.012em; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 0 0 52px; height: 22px; color: var(--muted); font-size: 12px; }

  /* keys */
  .keys { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: center; padding: 0 30px; }
  .key { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .key .caps { display: flex; gap: 6px; align-items: center; }
  .key .plus { color: var(--muted); font-size: 16px; }
  .key b { font-size: 19px; font-weight: 550; letter-spacing: -.02em; }
  .key span.d { margin-top: -16px; color: var(--muted); font-size: 14px; }
  .key + .key { border-left: 1px solid var(--hair); }

  /* secrets */
  .secret-row { display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 16px; border-radius: 12px; }
  .secret-row .tile { width: 34px; height: 34px; border-radius: 9px; }
  .secret-row .tile svg.i { width: 16px; height: 16px; }
  .secret-row .main { flex: 1; min-width: 0; }
  .secret-row .val { display: block; white-space: nowrap; overflow: hidden; font-size: 14px; }
  .secret-row .what { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
  .secret-row.lit { background: linear-gradient(180deg, rgba(127, 127, 127, .1), rgba(127, 127, 127, .05)); box-shadow: inset 0 0 0 1px var(--hair); }
  .cursor { position: absolute; z-index: 9; width: 22px; height: 22px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .4)); }
  .headline { font-size: 46px; font-weight: 600; letter-spacing: -.045em; line-height: 1.02; }
  .lede { margin-top: 16px; color: var(--muted); font-size: 18px; line-height: 1.45; letter-spacing: -.012em; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') === 'light' ? 'light' : 'dark';
  const shot = params.get('shot') || 'hero';
  document.documentElement.dataset.theme = theme;
  const dark = theme === 'dark';

  const SIZES = { hero: [1280, 600], title: [1280, 220], stack: [1280, 640], panels: [1280, 640], keys: [1280, 230], secrets: [1280, 460] };
  const [W, H] = SIZES[shot];
  document.documentElement.style.width = document.body.style.width = W + 'px';
  document.documentElement.style.height = document.body.style.height = H + 'px';

  // The glyphs from ui/app.js (without their motion parts), plus three keys only the README draws.
  const I = {
    text: '<path d="M4 6h16"/><path d="M4 12h12.5"/><path d="M4 18h8.5"/>',
    link: '<path d="M11 6.5 12.5 5a4.24 4.24 0 0 1 6 6L17 12.5"/><path d="M13 17.5 11.5 19a4.24 4.24 0 0 1-6-6L7 11.5"/><path d="m9.5 14.5 5-5"/>',
    code: '<path d="M7.5 8 3.5 12l4 4"/><path d="m16.5 8 4 4-4 4"/><path d="m13.25 6.5-2.5 11"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3.5"/><circle cx="16.5" cy="8.5" r="1.5"/><path d="M3.5 17 7.6 12.9a2 2 0 0 1 2.8 0L17.5 20"/><path d="m12.4 14.9 1.7-1.7a2 2 0 0 1 2.8 0l3.8 3.8"/>',
    file: '<path d="M14 3H8a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V8Z"/><path d="M14 3v3.5A1.5 1.5 0 0 0 15.5 8H19"/>',
    color: '<path d="M12 3.5a8.5 8.5 0 0 0 0 17c1 0 1.7-.7 1.7-1.6 0-.5-.2-.9-.5-1.2a1.7 1.7 0 0 1 1.3-2.8H17a3.5 3.5 0 0 0 3.5-3.5c0-4.4-3.8-7.9-8.5-7.9Z"/><path class="dot g-d1" d="M7.5 12h.01"/><path class="dot g-d2" d="M9 8h.01"/><path class="dot g-d3" d="M13.5 7h.01"/><path class="dot g-d4" d="M17 9.5h.01"/>',
    number: '<path d="M4.5 9h15"/><path d="M4.5 15h15"/><path d="M10 4 8 20"/><path d="m16 4-2 16"/>',
    key: '<circle cx="8" cy="16" r="4.5"/><path d="M11.2 12.8 19.5 4.5"/><path d="m16.5 7.5 2.5 2.5"/><path d="m14 10 1.75 1.75"/>',
    bank: '<path d="M4 9.5h16L12 4.5Z"/><path d="M4 20h16"/><path d="M7 12.5V17"/><path d="M12 12.5V17"/><path d="M17 12.5V17"/>',
    lock: '<rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.5v2"/>',
    card: '<rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M7 14.5h3"/>',
    db: '<ellipse cx="12" cy="6" rx="7.5" ry="2.5"/><path d="M4.5 6v12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5V6"/><path d="M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/>',
    command: '<path d="M9 9H6.25A2.75 2.75 0 1 1 9 6.25v11.5A2.75 2.75 0 1 1 6.25 15h11.5A2.75 2.75 0 1 1 15 17.75V6.25A2.75 2.75 0 1 1 17.75 9Z"/>',
    enter: '<path d="M19 5v6a3 3 0 0 1-3 3H5"/><path d="m9 10-4 4 4 4"/>',
    shift: '<path d="M12 4 4.5 12H9v7.5h6V12h4.5Z"/>',
    tab: '<path d="M20 5v14"/><path d="M4 12h12"/><path d="m12 8 4 4-4 4"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
    arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
    click: '<path d="M8 3v2.5"/><path d="M3 8h2.5"/><path d="m4.5 4.5 1.75 1.75"/><path d="m9 9 11 4.5-4.6 1.9-1.9 4.6Z"/>',
  };
  const svg = (name) => `<svg class="i" viewBox="0 0 24 24">${I[name]}</svg>`;
  const cmd = (sm) => `<span class="kbd${sm ? ' sm' : ''}">${svg('command')}</span>`;
  const cap = (t, sm) => `<span class="kbd${sm ? ' sm' : ''}">${t}</span>`;
  const popup = (q, style, onload) => {
    const f = document.createElement('iframe');
    f.className = 'pop';
    f.src = `../ui/index.html?os=mac&theme=${theme}&${q}`;
    f.style.cssText = style + `;color-scheme:${theme}`;
    if (onload) f.addEventListener('load', () => setTimeout(() => onload(f), 500));
    return f;
  };

  // Animated scenes set window.SCENE = { duration, fps } and window.setT(seconds); scripts/readme-anim.mjs
  // steps that clock frame by frame. Opened without ?anim, a scene shows the moment ?t= (or its own pick).
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (x) => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const seg = (t, a, b, f = ease) => f((t - a) / (b - a));
  const mix = (a, b, k) => a + (b - a) * k;
  // The popup frame with its own motion switched off, so the scene's clock decides every pixel.
  const still = (f) => {
    const st = f.contentDocument.createElement('style');
    st.textContent = '*, *::before, *::after { transition: none !important; animation: none !important; } .card.enter { opacity: 1 !important; transform: none !important; }';
    f.contentDocument.head.appendChild(st);
  };
  const typeInto = (f, text) => {
    const q = f.contentDocument.getElementById('q');
    if (q.value === text) return;
    q.value = text;
    q.dispatchEvent(new Event('input', { bubbles: true }));
  };

  const frame = document.getElementById('frame');
  const SHOTS = {
    // What really happens, at real speed: ⌃⌥V, the popup opens at the caret with the app's own
    // entrance, g h b finds the link, Enter closes it and the link is pasted where the caret was.
    hero() {
      frame.innerHTML = `<div class="art" style="background-position: ${dark ? '62% 30%' : '58% 40%'}; filter: saturate(${dark ? 1.15 : 1.05})"></div>
        <div class="scrim-l" style="background: linear-gradient(90deg, rgba(var(--scrim), .97) 0%, rgba(var(--scrim), .88) 32%, rgba(var(--scrim), .25) 58%, rgba(var(--scrim), .05) 100%)"></div>
        <div class="scrim-v"></div>
        <div class="halo" style="left: 640px; top: -80px; width: 760px; height: 760px; opacity: .6"></div>
        <div style="position: absolute; left: 76px; top: 92px; width: 520px; z-index: 6">
          <div class="icon"><i style="width: 40px"></i><i style="width: 32px"></i><i style="width: 22px"></i></div>
          <div class="word">stash</div>
          <div class="tag"><b>Everything you copied,</b><br>one keystroke away.</div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 40px">
            <span class="kbd" id="k0">⌃</span><span class="kbd" id="k1">⌥</span><span class="kbd" id="k2">V</span>
            <span style="margin-left: 14px; color: var(--muted); font-size: 16px; line-height: 1.35">A tiny clipboard history<br>for Windows and macOS</span>
          </div>
        </div>
        <div class="note" id="note" style="left: 640px; top: 64px; width: 580px">
          <div class="desk-bar"><i></i><i></i><i></i><span>Re: the paste bug</span></div>
          <div class="hdr"><span>To</span><b>Sam Rivera</b></div>
          <div class="body">Hi Sam,<br>Fixed it, see <span class="pasted" id="pasted"></span><span class="caret" id="caret"></span></div>
        </div>`;
      const el = (id) => document.getElementById(id);
      const pop = popup('', 'left: 0; top: 0; height: 540px; transform-origin: 40px 0', (f) => { still(f); SCENE.ready = true; render(); });
      frame.appendChild(pop);
      const LINK = 'github.com/b-evn/stash/issues/7';
      const fr = frame.getBoundingClientRect();
      let T = params.has('t') ? Number(params.get('t')) : 4;

      // A caret stays lit for .6 s after each key, then blinks slowly: .6 s off, .6 s on.
      const lit = (since) => since < .6 || Math.floor((since - .6) / .6) % 2 === 1;
      const BS = 7, STEP = .15;

      function render() {
        const t = T;
        const doc = pop.contentDocument;
        // The popup opens just below where the caret sits before the paste.
        el('pasted').textContent = '';
        const c0 = el('caret').getBoundingClientRect();
        const cx = c0.left - fr.left, cy = c0.top - fr.top;
        pop.style.left = (cx - 40) + 'px';
        pop.style.top = (cy + 2) + 'px';

        // ⌃ and ⌥ held, V tapped.
        el('k0').classList.toggle('lit', t > 1.6 && t < 2.35);
        el('k1').classList.toggle('lit', t > 1.75 && t < 2.35);
        el('k2').classList.toggle('lit', t > 1.95 && t < 2.12);
        // Shown on V with the app's entrance (card-in: .34s, 4px drop, slight scale and blur); gone at once on Enter.
        const shown = t >= 1.95 && t < 4.8;
        const k = seg(t, 1.95, 2.29, out);
        pop.style.opacity = shown ? k : 0;
        pop.style.transform = `translateY(${mix(-4, 0, k)}px) scale(${mix(.985, 1, k)})`;
        pop.style.filter = `blur(${(1 - k) * 4}px)`;
        const typed = t < 2.95 ? '' : t < 3.3 ? 'g' : t < 3.62 ? 'gh' : 'ghb';
        typeInto(pop, typed);
        // The search field's caret, drawn by hand so it blinks on the scene's clock.
        const q = doc.getElementById('q');
        let fake = doc.getElementById('fake-caret');
        if (!fake) {
          q.style.caretColor = 'transparent';
          fake = doc.createElement('span');
          fake.id = 'fake-caret';
          fake.style.cssText = 'position: absolute; width: 1.5px; height: 17px; border-radius: 1px; background: currentColor; pointer-events: none';
          q.parentElement.style.position = 'relative';
          q.parentElement.appendChild(fake);
        }
        const cv = (render.cv = render.cv || doc.createElement('canvas')).getContext('2d');
        const cs = doc.defaultView.getComputedStyle(q);
        cv.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const qb = q.getBoundingClientRect(), lb = q.parentElement.getBoundingClientRect();
        fake.style.left = (qb.left - lb.left + parseFloat(cs.paddingLeft) + cv.measureText(typed).width) + 'px';
        fake.style.top = (qb.top - lb.top + (qb.height - 17) / 2) + 'px';
        fake.style.color = cs.color;
        const lastKey = t < 2.95 ? 1.95 : t < 3.3 ? 2.95 : t < 3.62 ? 3.3 : 3.62;
        fake.style.opacity = lit(t - lastKey) ? 1 : 0;
        const enterKbd = doc.querySelector('#hints kbd');
        if (enterKbd) {
          const down = t > 4.62 && t < 4.8;
          enterKbd.style.transform = down ? 'translateY(1px)' : '';
          enterKbd.style.filter = down ? 'brightness(1.4)' : '';
        }
        // Pasted in one go, and the mail app makes it a link. Then Backspace is pressed once per letter, every
        // .15 s, until the link is gone and the loop is back where it began.
        let shownLink = '';
        if (t >= 4.9) shownLink = LINK.slice(0, Math.max(0, LINK.length - (t >= BS ? Math.floor((t - BS) / STEP) + 1 : 0)));
        el('pasted').textContent = shownLink;
        el('pasted').style.cssText = shownLink ? `color: ${dark ? '#58a6ff' : '#0969da'}; text-decoration: underline; text-underline-offset: 3px` : '';
        // The reply's caret, timed from its last key: the paste, or the latest Backspace.
        const presses = t >= BS ? Math.min(LINK.length, Math.floor((t - BS) / STEP) + 1) : 0;
        const lastKeyAt = presses ? BS + (presses - 1) * STEP : t >= 4.9 ? 4.9 : 0;
        el('caret').style.opacity = !shown && lit(t - lastKeyAt) ? 1 : 0;
      }
      window.SCENE = { duration: 13, fps: 25, ready: false };
      window.setT = (t) => { T = t; render(); return Promise.resolve(); };
    },

    // A section's title as a banner: numeral, heading and line on the left, a detail of the painting on
    // the right with the section's own tiles floating over it. ?s=1..6 picks the section.
    title() {
      const S = {
        1: ['I', 'Everything goes in', 'Text, links, code, images, files and colours.', ['text', 'link', 'code', 'image', 'file', 'color'], dark ? '58% 22%' : '30% 25%'],
        2: ['II', 'Paste stack', 'Collect in order, paste with plain Ctrl+V.', ['click', 'arrow', 'enter'], dark ? '44% 70%' : '70% 55%'],
        3: ['III', 'Keys', 'Everything from the keyboard.', ['command', 'enter', 'shift', 'tab'], dark ? '80% 40%' : '85% 20%'],
        4: ['IV', 'Find anything', 'Loose matching, filters as chips.', ['search', 'code', 'image'], dark ? '20% 55%' : '15% 60%'],
        5: ['V', 'Private by default', 'Secrets blurred, history encrypted.', ['lock', 'key', 'card', 'bank'], dark ? '66% 85%' : '50% 85%'],
        6: ['VI', 'Build', 'From source, on Windows or macOS.', ['code', 'command', 'file'], dark ? '35% 40%' : '35% 75%'],
      };
      const [n, h, line, icons, pos] = S[params.get('s') || 1];
      // No frame: the banner is see-through and its painting dissolves at every edge, so it sits on
      // GitHub's own page colour (#0d1117 dark, #fff light) like part of the text, flush with its left edge.
      frame.classList.add('bare');
      const fg = dark ? '#f0f6fc' : '#1f2328', muted = dark ? '#9198a1' : '#59636e';
      frame.innerHTML = `<div class="art" style="left: 30%; background-position: ${pos}; background-size: 190%; filter: saturate(1.1) brightness(${dark ? .8 : 1.02});
          -webkit-mask: linear-gradient(90deg, transparent, rgba(0, 0, 0, .35) 22%, #000 48%, #000 78%, transparent), linear-gradient(transparent, rgba(0, 0, 0, .6) 22%, #000 42%, #000 58%, rgba(0, 0, 0, .6) 78%, transparent); -webkit-mask-composite: source-in; mask-composite: intersect"></div>
        <div style="position: absolute; left: 0; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; z-index: 3">
          <div class="serif" style="display: flex; align-items: center; gap: 14px; color: var(--gold); font-size: 24px; letter-spacing: .18em">${n}<span style="width: 44px; height: 1px; background: var(--gold-soft)"></span></div>
          <div style="margin: 8px 0 0 -3px; font-size: 76px; font-weight: 600; letter-spacing: -.045em; line-height: 1; color: ${fg}">${h}</div>
          <div style="margin-top: 14px; color: ${muted}; font-size: 27px; letter-spacing: -.015em">${line}</div>
        </div>
        <div style="position: absolute; right: 64px; top: 0; bottom: 0; display: flex; align-items: center; gap: 16px; z-index: 3">
          ${icons.map((k, i) => `<span class="tile ttile" style="transform: translateY(${[-10, 8, -4, 10, -8, 4][i]}px)">${svg(k)}</span>`).join('')}
        </div>`;
    },

      const steps = [

        ['invoice-0923.pdf', 'Invoice'],
      ];
      frame.innerHTML = `<div class="art" style="background-position: ${dark ? '50% 20%' : '40% 50%'}; filter: blur(2px) saturate(.9); transform: scale(1.02)"></div>
        <div style="position: absolute; inset: 0; background: rgba(var(--scrim), ${dark ? .62 : .58})"></div>
        <div class="desk" style="left: 56px; top: 52px; width: 560px; height: 640px">
          <div class="desk-bar"><i></i><i></i><i></i><span>Vendor portal — Payment details</span></div>
          <div class="field"><label>Billing email</label><div class="input focus"><span class="caret"></span></div></div>
          <div class="field"><label>IBAN</label><div class="input">DE00 0000 0000 0000 0000 00</div></div>

        </div>
        <div style="position: absolute; left: 700px; top: 66px; width: 520px; z-index: 3">
          <div class="headline">Collect in order.<br>Paste with plain ${dark ? '⌘V' : '⌘V'}.</div>
          <div class="lede">⌘-click clips to stack them. Each ⌘V pastes the next one, in any app, Tab between fields.</div>
        </div>

          ${steps.map(([v, f], i) => `${i ? `<div class="tab">${cap(svg('tab'), true)} next field</div>` : ''}
            <div class="step"><span class="n${i === 0 ? ' next' : ''}">${i + 1}</span>${cmd(true)}${cap('V', true)}
              <span class="arrow">${svg('arrow')}</span><span class="v">${v}</span>

        </div>`;
      frame.appendChild(popup('stack=6,11,1,4&sel=1', 'left: 64px; top: 136px; height: 520px'));
    },

    panels() {
      frame.innerHTML = `<div class="art" style="background-position: 50% 35%; filter: blur(3px) saturate(.85); transform: scale(1.03)"></div>
        <div style="position: absolute; inset: 0; background: rgba(var(--scrim), ${dark ? .7 : .62})"></div>
        <div class="caption" style="left: 40px; width: 384px; top: 36px"><b>Filter as you type.</b> Kinds, words to skip.</div>
        <div class="caption" style="left: 448px; width: 384px; top: 36px"><b>Hold Shift</b> to read the whole clip.</div>
        <div class="caption" style="left: 856px; width: 384px; top: 36px"><b>Settings</b> live in the popup.</div>`;
      frame.appendChild(popup('q=@file%20!logo%20', 'left: 16px; top: 54px; height: 590px'));
      frame.appendChild(popup('tab=code', 'left: 424px; top: 54px; height: 590px', (f) => {
        f.contentWindow.focus();
        f.contentDocument.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
      }));
      frame.appendChild(popup('view=settings', 'left: 832px; top: 54px; height: 590px'));
    },

    keys() {
      const K = [
        [`${cap('⌃')}${cap('⌥')}${cap('V')}`, 'Open', 'anywhere, at the caret'],
        [cap(svg('enter')), 'Paste', 'the selected clip'],
        [`${cmd()}${cap('1')}<span class="plus">–</span>${cap('9')}`, 'Paste a row', 'by its number'],
        [cap(svg('shift') + '&nbsp;hold'), 'Preview', 'images, code, long text'],
        [`${cmd()}<span class="plus">+</span>${cap(svg('click'))}`, 'Stack', 'paste in order'],
        [cap(svg('tab')), 'Kinds', 'all · text · links · code…'],
      ];
      frame.innerHTML = `<div class="lamp"></div><div class="keys">${K.map(([c, b, d]) => `
        <div class="key"><span class="caps">${c}</span><b>${b}</b><span class="d">${d}</span></div>`).join('')}</div>`;
    },

    secrets() {
      const rows = [
        ['bank', 'IBAN', 'DE89<span class="secret">3704004405320130</span>3000'],
        ['card', 'Visa card', '<span class="secret">4111 1111 1111</span> 1111'],
        ['key', 'GitHub token', 'ghp_<span class="secret">a8Fk29QmZr7tLx0pVb3n</span>2345'],
        ['lock', 'Password', 'DB_PASSWORD=<span class="secret">Tr0ub4dor&amp;3</span>'],
        ['db', 'Database URL', 'postgres://app:<span class="secret">hunter2</span>@db:5432/main'],
      ];
      frame.innerHTML = `<div class="art" style="background-position: ${dark ? '30% 20%' : '50% 30%'}; filter: blur(2px) saturate(.85); transform: scale(1.02)"></div>
        <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(var(--scrim), .96) 0, rgba(var(--scrim), .9) 44%, rgba(var(--scrim), .6) 100%)"></div>
        <div style="position: absolute; left: 76px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; z-index: 3">
          <div class="headline">Secrets stay<br>out of sight.</div>
          <div class="lede">IBANs, cards, tokens and passwords are blurred in the list, and each row names what it holds. Hover to read; pasting gives you the clip as it was copied.</div>
        </div>
        <div class="glass" style="position: absolute; left: 630px; top: 62px; width: 580px; padding: 10px">
          ${rows.map(([icon, what, val], i) => `<div class="secret-row${i === 3 ? ' lit' : ''}"><span class="tile">${svg(icon)}</span>
            <span class="main"><span class="val mono">${i === 3 ? val.replace('class="secret"', '') : val}</span><span class="what">${what}</span></span></div>`).join('')}
        </div>
        <svg class="cursor" viewBox="0 0 24 24" style="left: 858px; top: 266px"><path d="M4 2l15 9-6.5 1.5L16 20l-3 1.5-3.5-7.5L4 18z" fill="${dark ? '#fafafa' : '#09090b'}" stroke="${dark ? '#09090b' : '#fff'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
    },
  };
  SHOTS[shot]();
</script>
