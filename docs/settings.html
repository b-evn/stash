<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stash settings</title>
<style>
  html, body { width: 824px; height: 540px; }
  body { margin: 0; position: relative; overflow: hidden; background: linear-gradient(90deg, #18181b 50%, #e4e4e7 50%); }
  iframe { position: absolute; top: 0; border: 0; width: 416px; height: 540px; background: transparent; }
</style>
</head>
<body>
  <iframe src="../ui/index.html?os=win&theme=dark&view=settings" style="left: 0; color-scheme: dark"></iframe>
  <iframe id="end" src="../ui/index.html?os=win&theme=light&view=settings" style="left: 408px; color-scheme: light"></iframe>
  <script>
    // The right popup shows the end of the page. Needs the scene served over http, so the frame is same-origin.
    const end = document.getElementById('end');
    end.addEventListener('load', () => setTimeout(() => {
      const body = end.contentDocument && end.contentDocument.getElementById('prefs-body');
      if (body) { body.scrollTop = body.scrollHeight; body.dispatchEvent(new Event('scroll')); }
    }, 400));
  </script>
</body>
</html>
