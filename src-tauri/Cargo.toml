[package]
name = "stash"
version = "0.1.0"
description = "A tiny clipboard history that pops up right where you type."
edition = "2021"
license = "MIT"

[lib]
name = "stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# SQLCipher encrypts the history; on macOS it uses Apple's CommonCrypto.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
getrandom = "0.3"
arboard = "3"
clipboard-master = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
base64 = "0.22"
# Secret patterns need lookaround, which only fancy-regex has.
regex = "1"
fancy-regex = "0.14"

[target.'cfg(windows)'.dependencies]
# Windows has no system crypto SQLCipher can use, so OpenSSL is built in (needs Perl to build).
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
# Raw CF_HTML, which arboard only reads as a fragment.
clipboard-win = "5"
windows = { version = "0.61", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSData",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFPreferences",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColorSpace",
    "CGDataProvider",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    "CGRemoteOperation",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
    "std",
    "AXError",
    "AXUIElement",
    "AXValue",
    "HIServices",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-graphics",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
] }

[profile.release]
opt-level = "s"
lto = true
# 16 rather than 1: half the build time for a binary about 1% larger.
codegen-units = 16
strip = true
panic = "abort"
